name: M1 foundation
on:
  pull_request:
  push:
    branches: [main, feature/m1-foundation]
permissions:
  contents: read
concurrency:
  group: m1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.1'
      - run: uv sync --frozen
      - run: make lint typecheck test-unit
      - run: make dev-secrets
      - run: make test-integration
      - run: make smoke-compose
      - name: Clean disposable services
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -p atp-m1-test down --volumes --remove-orphans
          fi
