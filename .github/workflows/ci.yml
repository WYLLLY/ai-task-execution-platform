name: M1 through M3 verification
on:
  pull_request:
  push:
    branches: [main, feature/m1-foundation, feature/m2, feature/m3]
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0, node24
        with:
          version: '0.13.1'
      - run: uv sync --frozen
      - run: make lint typecheck test-unit
      - run: make dev-secrets
      - run: make test-integration
      - run: make smoke-compose
      - name: Clean disposable services
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -p atp-m1-test down --volumes --remove-orphans
          fi
