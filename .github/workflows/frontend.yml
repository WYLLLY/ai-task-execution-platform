name: Local frontend verification
on:
  pull_request:
  push:
    branches: [main, feature/local-frontend]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec prettier --check app lib tests '*.json' '*.mjs' '*.ts'
      - run: pnpm build
