# M6 private test proxy; production TLS/deployment remain M7.
services:
  proxy:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 50
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [private]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/live]
      interval: 2s
      timeout: 2s
      retries: 30
