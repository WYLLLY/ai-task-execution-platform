worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=per_ip:1m rate=60r/s;
    limit_req_zone $server_name zone=deployment:1m rate=120r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    server {
        listen 8080;
        client_max_body_size 1m;
        limit_req zone=per_ip burst=100 nodelay;
        limit_req zone=deployment burst=200 nodelay;
        limit_req_status 429;
        limit_conn connections 200;
        send_timeout 5s;
        location = /metrics { return 404; }
        location / {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 310s;
            proxy_send_timeout 5s;
            gzip off;
        }
    }
}
